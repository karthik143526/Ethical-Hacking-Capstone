<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Capstone Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--panel-border); }
        th { color: var(--accent-neon); font-family: var(--font-heading); }
        tr:hover { background: rgba(255,255,255,0.05); }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .Secure { background: rgba(46, 160, 67, 0.2); color: var(--accent-green); }
        .Needs.Improvement { background: rgba(210, 153, 34, 0.2); color: var(--accent-orange); }
        .Poor { background: rgba(248, 81, 73, 0.2); color: var(--accent-danger); }
        .tabs { display: flex; gap: 20px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: 1px solid var(--panel-border); background: rgba(0,0,0,0.2); color: white; border-radius: 6px; }
        .tab-btn.active { border-color: var(--accent-neon); color: var(--accent-neon); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="glass-panel">
            <div class="logo">
                <span class="neon-text">Administration</span>
                <h1>Admin Panel</h1>
            </div>
            <div>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>
        </header>

        <main class="card glass-panel" style="padding: 30px;">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('assessments')">All Assessments</button>
                <button class="tab-btn" onclick="showTab('users')">All Users</button>
            </div>

            <div id="tab-assessments" class="tab-content active">
                <table id="assessments-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Wi-Fi Name</th>
                            <th>Score</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="assessments-body">
                        <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="tab-users" class="tab-content">
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Joined</th>
                        </tr>
                    </thead>
                    <tbody id="users-body">
                        <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        async function checkAdminAuth() {
            try {
                const response = await fetch('api/auth.php?action=check');
                const result = await response.json();
                if(result.status !== 'success' || result.role !== 'admin') {
                    window.location.href = 'login.html';
                } else {
                    loadAssessments();
                    loadUsers();
                }
            } catch(e) { window.location.href = 'login.html'; }
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
        }

        async function loadAssessments() {
            const res = await fetch('api/admin.php?action=assessments');
            const result = await res.json();
            let html = '';
            if(result.data.length === 0) html = '<tr><td colspan="6" style="text-align:center;">No assessments.</td></tr>';
            else {
                result.data.forEach(r => {
                    const cssClass = r.status.replace(' ', '.');
                    html += `<tr>
                        <td>${r.id}</td>
                        <td>${r.user_name}</td>
                        <td>${r.ssid}</td>
                        <td>${r.score}</td>
                        <td><span class="badge ${cssClass}">${r.status}</span></td>
                        <td>
                            <a href="results.html?id=${r.id}" class="nav-link" style="margin-right:10px;">View</a>
                            <a href="#" class="nav-link" style="color:var(--accent-danger);" onclick="deleteAsses(${r.id})">Delete</a>
                        </td>
                    </tr>`;
                });
            }
            document.getElementById('assessments-body').innerHTML = html;
        }

        async function loadUsers() {
            const res = await fetch('api/admin.php?action=users');
            const result = await res.json();
            let html = '';
            result.data.forEach(u => {
                html += `<tr>
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.role}</td>
                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                </tr>`;
            });
            document.getElementById('users-body').innerHTML = html;
        }

        async function deleteAsses(id) {
            if(confirm('Are you sure you want to delete this assessment?')) {
                await fetch('api/admin.php?action=delete_assessment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                loadAssessments();
            }
        }

        async function logout() {
            await fetch('api/auth.php?action=logout');
            window.location.href = 'login.html';
        }

        window.addEventListener('DOMContentLoaded', checkAdminAuth);
    </script>
</body>
</html>
